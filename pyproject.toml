[project]
name = "agenarc"
version = "0.5.0"
description = "Directed-graph Agent Orchestration Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rycbartbad" },
]
keywords = ["agent", "orchestration", "graph", "workflow", "llm", "ai"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "openai>=1.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.30",
]
plugins = [
    "watchdog>=4.0",
    "aiohttp>=3.9",
    "websockets>=12.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.8",
]
euchea = [
    "keyboard>=0.13",
    "markitdown>=0.1",
    "pdfplumber>=0.10",
    "PyMuPDF>=1.23",
]

[project.scripts]
agenarc = "agenarc.cli.__main__:main"

[project.urls]
homepage = "https://github.com/Rycbartbad/agenarc"
repository = "https://github.com/Rycbartbad/agenarc"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agenarc*"]

[tool.setuptools.package-data]
agenarc = ["visualization/static/*", "prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["N801", "N805", "N806", "N815", "N817"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"agenarc/cli/commands/__init__.py" = ["E402"]
"agenarc/engine/executor.py" = ["E402"]
"agenarc/operators/builtin.py" = ["E402"]
"agenarc/visualization/server.py" = ["E402"]
"agenarc/plugins/hot_loader.py" = ["E402"]
"agenarc/plugins/qq_reply_plugin/plugin.py" = ["E402"]
"agenarc/protocol/loader.py" = ["E402"]
"agenarc/plugins/loaders/external.py" = ["E402"]
"agenarc/operators/operator.py" = ["B027"]
"agenarc/plugins/event_plugin.py" = ["B027"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
